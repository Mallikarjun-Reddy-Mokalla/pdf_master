name: pdf_master
description: "PDF Master - All Your Documents. One Powerful App."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_bloc: ^9.0.0
  equatable: ^2.0.7

  # Local Database & Storage
  sqflite: ^2.4.1
  path_provider: ^2.1.5
  path: ^1.9.1
  shared_preferences: ^2.3.5

  # Document & Media Handling
  file_picker: ^11.0.3
  image_picker: ^1.1.2
  share_plus: ^10.1.4
  open_filex: ^4.5.0
  camera: ^0.11.2

  # PDF Engine & Viewer (Syncfusion + Community PDF)
  syncfusion_flutter_pdf: ^28.2.9
  syncfusion_flutter_pdfviewer: ^28.2.9
  pdf: ^3.11.1
  printing: ^5.13.3

  # Image & Archive Processing & Utilities
  image: ^4.5.4
  archive: ^4.6.0
  uuid: ^4.5.1
  intl: ^0.20.2
  google_mobile_ads: ^9.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  archive: ^4.6.0

flutter:
  uses-material-design: true
